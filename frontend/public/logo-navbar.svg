<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.3" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo: Glowing ring -->
  <circle cx="20" cy="20" r="15" fill="none" stroke="#4FC3F7" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Logo: Dark blue circle -->
  <circle cx="20" cy="20" r="12" fill="#1565C0"/>
  
  <!-- Equalizer bars (left side) -->
  <g filter="url(#glow)">
    <rect x="8" y="14" width="1.5" height="5" fill="#4FC3F7" rx="1"/>
    <rect x="10.5" y="12" width="1.5" height="9" fill="#4FC3F7" rx="1"/>
    <rect x="13" y="10" width="1.5" height="13" fill="#4FC3F7" rx="1"/>
    <rect x="15.5" y="13" width="1.5" height="7" fill="#4FC3F7" rx="1"/>
  </g>
  
  <!-- Small circle and line (left of equalizer) -->
  <circle cx="5" cy="20" r="1.5" fill="#4FC3F7" filter="url(#glow)"/>
  <line x1="7" y1="20" x2="8" y2="20" stroke="#4FC3F7" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Play button (center) -->
  <path d="M 17 15 L 17 25 L 25 20 Z" fill="white" opacity="0.95"/>
  
  <!-- Text: Motion Amplifier -->
  <text x="38" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Motion
  </text>
  <text x="38" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Amplifier
  </text>
</svg>

